<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>店員核銷系統</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
    body { font-family: sans-serif; background: #1e293b; color: white; display: flex; justify-content: center; padding: 20px; }
    .panel { background: #334155; padding: 24px; border-radius: 12px; max-width: 400px; width: 100%; text-align: center; }
    #reader { width: 100%; margin: 15px 0; border-radius: 8px; overflow: hidden; }
    textarea, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: none; box-sizing: border-box; }
    button { background: #3b82f6; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    #result { margin-top: 20px; padding: 12px; border-radius: 6px; font-weight: bold; }
    .success { background: #16a34a; }
    .error { background: #dc2626; }
</style>
</head>
<body>
<div class="panel">
    <h2>📷 店員掃碼核銷終端</h2>
    <div id="reader"></div>
    <p style="font-size: 12px; color: #cbd5e1;">（若電腦無鏡頭，可直接貼上 QR Code JSON 字串測試）</p>
    <textarea id="manualInput" rows="3" placeholder='{"couponCode":"...","nonce":"..."}'></textarea>
    <button onclick="manualRedeem()">手動執行核銷</button>
    <div id="result"></div>
</div>

<script>
    async function processRedeem(qrText) {
    const resultDiv = document.getElementById('result');
    resultDiv.className = '';
    resultDiv.innerText = '驗證中...';

    try {
        const parsed = JSON.parse(qrText);
        const res = await fetch('/api/coupons/redeem', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ couponCode: parsed.couponCode, nonce: parsed.nonce })
        });
        const data = await res.json();

        if (res.ok) {
        resultDiv.className = 'success';
        resultDiv.innerText = `✅ 核銷成功！時間：${new Date(data.coupon.redeemedAt).toLocaleTimeString()}`;
        } else {
        resultDiv.className = 'error';
        resultDiv.innerText = `🚨 核銷失敗：${data.error}`;
        }
    } catch (e) {
        resultDiv.className = 'error';
        resultDiv.innerText = '🚨 無效的 QR Code 格式';
    }
    }

    function manualRedeem() {
    const val = document.getElementById('manualInput').value.trim();
    if (val) processRedeem(val);
    }

    // 啟動相機掃描器
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 220, height: 220 } },
    (decodedText) => {
        html5QrCode.stop();
        processRedeem(decodedText);
    }
    ).catch(() => {
    document.getElementById('reader').innerHTML = '<p style="font-size:13px;color:#94a3b8;">未偵測到相機或無 HTTPS 權限，請使用下方手動輸入測試。</p>';
    });
</script>
</body>
</html>
